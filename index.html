<!DOCTYPE html>
<html lang="en">
<head>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header p  { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    #mode-btn {
      margin-left: auto;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #mode-btn:hover { background: #334155; color: #e2e8f0; }

    /* Day mode overrides */
    body.day-mode { background: #f1f5f9; color: #1e293b; }
    body.day-mode header { background: #fff; border-color: #e2e8f0; }
    body.day-mode header h1 { color: #0f172a; }
    body.day-mode header p  { color: #64748b; }
    body.day-mode #mode-btn { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
    body.day-mode #mode-btn:hover { background: #e2e8f0; }
    body.day-mode .route-tabs { background: #fff; border-color: #e2e8f0; }
    body.day-mode .route-tab  { color: #94a3b8; }
    body.day-mode .route-tab:hover { color: #0f172a; }
    body.day-mode .sidebar { background: #fff; border-color: #e2e8f0; }
    body.day-mode .itin-header { border-color: #e2e8f0; }
    body.day-mode .itin-sub  { color: #64748b; }
    body.day-mode .badge { background: #f8fafc; border-color: #e2e8f0; color: #64748b; }
    body.day-mode .cost-block { background: #f8fafc; border-color: #e2e8f0; }
    body.day-mode .cost-block h3 { color: #94a3b8; }
    body.day-mode .cost-item { background: #fff; }
    body.day-mode .cost-label { color: #94a3b8; }
    body.day-mode .cost-total { background: #eff6ff; border-color: #3b82f6; }
    body.day-mode .cost-total .cost-value { color: #2563eb; }
    body.day-mode .cost-note { color: #94a3b8; }
    body.day-mode .section-heading { color: #94a3b8; }
    body.day-mode .stop-card { background: #f8fafc; border-color: #e2e8f0; }
    body.day-mode .stop-card:hover { border-color: #cbd5e1; }
    body.day-mode .stop-card.selected { border-color: #3b82f6; }
    body.day-mode .stop-name { color: #0f172a; }
    body.day-mode .stop-meta { color: #94a3b8; }
    body.day-mode .stop-body { color: #64748b; }
    body.day-mode .hl-tag { background: #f1f5f9; border-color: #e2e8f0; color: #475569; }
    body.day-mode .seg-card.seg-active { background: #f1f5f9; }
    body.day-mode .seg-road  { color: #334155; }
    body.day-mode .seg-notes { color: #94a3b8; }
    body.day-mode .loading-bar { background: #fff; border-color: #e2e8f0; color: #64748b; }

    .route-tabs {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 16px;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .route-tab {
      padding: 10px 18px;
      border: none;
      background: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;

    .route-tab.active-A { color: #f97316; border-bottom-color: #f97316; }
    .route-tab.active-B { color: #818cf8; border-bottom-color: #818cf8; }
    .route-tab.active-C { color: #4ade80; border-bottom-color: #4ade80; }

    .main { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; min-width: 0; }

    .sidebar {
      width: 390px;
      background: #1e293b;
      overflow-y: auto;
      border-left: 1px solid #334155;
      flex-shrink: 0;
    }

    .itin-sub    { font-size: 0.72rem; color: #94a3b8; line-height: 1.5; }

    .badge       { background: #0f172a; border-radius: 20px; padding: 3px 10px; font-size: 0.68rem; color: #94a3b8; border: 1px solid #334155; }

    /* Cost block */
    .cost-block { padding: 14px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .cost-block h3 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; margin-bottom: 10px; }
    .cost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cost-item { background: #1e293b; border-radius: 8px; padding: 9px 12px; }
    .cost-label { font-size: 0.65rem; color: #64748b; margin-bottom: 2px; }
    .cost-value { font-size: 0.88rem; font-weight: 700; }
    .cost-total { grid-column: 1 / -1; background: #172554; border-left: 3px solid #3b82f6; }
    .cost-total .cost-value { color: #60a5fa; font-size: 0.95rem; }
    .cost-note  { font-size: 0.65rem; color: #64748b; margin-top: 6px; line-height: 1.4; }

    /* Section heading */
    .section-heading {
      padding: 14px 20px 6px;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #475569;
    }

    /* Stop cards */
    .stops-list { padding: 4px 12px 20px; }
    .stop-card {
      background: #0f172a;
      border-radius: 10px;
      margin-bottom: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      border: 1px solid #1e293b;
    }
    .stop-card:hover { transform: translateX(3px); border-color: #334155; }
    .stop-card.selected { border-color: #3b82f6; }
    .stop-header { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
    .stop-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800;
      flex-shrink: 0;
    }
    .stop-info { flex: 1; min-width: 0; }
    .stop-name { font-size: 0.84rem; font-weight: 700; }
    .stop-meta { font-size: 0.68rem; color: #64748b; margin-top: 1px; }
    .stop-body { padding: 0 14px 11px 54px; font-size: 0.72rem; color: #94a3b8; line-height: 1.55; }
    .stop-highlights { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
    .hl-tag {
      background: #1e293b;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.63rem;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    /* Segment rows */
    .seg-card {
      background: transparent;
      margin: 0 12px 4px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 2px solid #334155;
      font-size: 0.7rem;
      margin-left: 36px;
    }
    .seg-arrow  { color: #475569; flex-shrink: 0; }
    .seg-info   { flex: 1; }
    .seg-road   { color: #cbd5e1; font-weight: 600; }
    .seg-notes  { color: #475569; margin-top: 1px; }
    .seg-dist   { text-align: right; flex-shrink: 0; font-weight: 700; color: #94a3b8; font-size: 0.68rem; }

    /* Segment highlighted state */
    .seg-card { cursor: pointer; border-radius: 4px; transition: background 0.15s; }
    .seg-card:hover { background: #0f172a20; }
    .seg-card.seg-active { background: #0f172a; border-radius: 4px; }

    /* Loading spinner */
    .loading-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid #334155; border-radius: 20px;
      padding: 5px 14px; font-size: 0.7rem; color: #94a3b8;
      z-index: 1000; display: none; gap: 6px; align-items: center;
    }
    .loading-bar.visible { display: flex; }
    .spinner {
      width: 10px; height: 10px; border: 2px solid #334155;
      border-top-color: #60a5fa; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid #334155; height: 52dvh; flex-shrink: 0; }
      #map { height: 48dvh; flex: none; }
    }
  </style>
</head>

// ─────────────────────────────────────────────────────────────
// MAP + DAY/NIGHT
// ─────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([37.5, -114], 6);

const TILE_URLS = {
  dark:  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
};
let isDark = true;
let tileLayer = L.tileLayer(TILE_URLS.dark, {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 20
}).addTo(map);

// Dynamic popup / tooltip styles (updated on mode switch)
const dynStyle = document.createElement('style');
document.head.appendChild(dynStyle);

function applyPopupStyles() {
  if (isDark) {
    dynStyle.textContent = `
      .leaflet-popup-content-wrapper { background:#1e293b; color:#e2e8f0; border:1px solid #334155; box-shadow:0 4px 24px #0008; border-radius:10px; }
      .leaflet-popup-tip { background:#1e293b; }
      .dark-tip { background:#1e293b!important; color:#e2e8f0!important; border:1px solid #334155!important; font-size:0.72rem!important; border-radius:6px!important; padding:6px 10px!important; white-space:nowrap; }
      .leaflet-tooltip.dark-tip::before { display:none; }
    `;
  } else {
    dynStyle.textContent = `
      .leaflet-popup-content-wrapper { background:#fff; color:#1e293b; border:1px solid #e2e8f0; box-shadow:0 4px 24px #0002; border-radius:10px; }
      .leaflet-popup-tip { background:#fff; }
      .dark-tip { background:#fff!important; color:#1e293b!important; border:1px solid #e2e8f0!important; font-size:0.72rem!important; border-radius:6px!important; padding:6px 10px!important; white-space:nowrap; }
      .leaflet-tooltip.dark-tip::before { display:none; }
    `;
  }
}
applyPopupStyles();

function toggleMode() {
  isDark = !isDark;
  // Swap tile layer
  map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(isDark ? TILE_URLS.dark : TILE_URLS.light, {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 20
  }).addTo(map);
  // Make sure tile layer is below route layers
  tileLayer.bringToBack();
  // Swap body class and button label
  document.body.classList.toggle('day-mode', !isDark);
  document.getElementById('mode-btn').textContent = isDark ? '\u2600 Day Mode' : '\uD83C\uDF19 Night Mode';
  applyPopupStyles();
}

// Per-route storage
// segLines[key]   = array of L.polyline, one per driving leg
// stopMks[key]    = array of L.marker, one per stop
// mapGroup[key]   = L.layerGroup holding everything for that route
const segLines  = {};
const stopMks   = {};
const mapGroup  = {};
const built     = {};   // true once buildRoute has been called for this key

let currentRoute  = 'A';
let activeSegIdx  = -1;   // which leg is highlighted (-1 = none / show all)

// ─────────────────────────────────────────────────────────────
// LOADING BAR
// ─────────────────────────────────────────────────────────────
const loadingBar  = document.getElementById('loading-bar');
const loadingText = document.getElementById('loading-text');
let   pendingLegs = 0;

function updateLoading(delta, routeKey) {
  pendingLegs += delta;
  if (pendingLegs > 0 && currentRoute === routeKey) {
    loadingText.textContent = `Loading route… (${pendingLegs} legs remaining)`;
    loadingBar.classList.add('visible');
  } else {
    loadingBar.classList.remove('visible');
    pendingLegs = 0;
  }
}

// ─────────────────────────────────────────────────────────────
// OSRM — two servers, manual timeout, road-network geometry
// ─────────────────────────────────────────────────────────────
const OSRM_SERVERS = [
  'https://router.project-osrm.org',
  'https://routing.openstreetmap.de/routed-car'
];

async function fetchOSRM(fromLat, fromLng, toLat, toLng) {
  for (const base of OSRM_SERVERS) {
    const url = `${base}/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 14000);
    try {
      const res  = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      const data = await res.json();
      if (data.routes?.[0]) {
        // OSRM returns [lng, lat] pairs — swap to [lat, lng] for Leaflet
        return data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      }
    } catch (_) {
      clearTimeout(timer);
    }
  }
  return null;   // both servers failed — placeholder remains
}

// ─────────────────────────────────────────────────────────────
// NUMBERED STOP MARKER
// ─────────────────────────────────────────────────────────────
function makeStopMarker(stop, color, routeKey, stopIdx) {
  const icon = L.divIcon({
    html: `<div style="
      width:28px;height:28px;border-radius:50%;
      background:${color};border:2.5px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,0.6);
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:900;color:#fff;
      font-family:system-ui,sans-serif;
    ">${stop.num}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    className: ''
  });

  const m = L.marker([stop.lat, stop.lng], { icon, zIndexOffset: 100 });
  m.bindPopup(`
    <div style="font-family:system-ui;min-width:210px;padding:2px 0">
      <div style="font-size:0.85rem;font-weight:800;margin-bottom:3px;color:${color}">${stop.num}. ${stop.name}</div>
      <div style="font-size:0.7rem;color:#94a3b8;margin-bottom:6px">${stop.sub}</div>
      <div style="font-size:0.72rem;color:#cbd5e1;line-height:1.5">${stop.desc}</div>
    </div>
  `, { maxWidth: 280 });

  // clicking marker highlights outgoing leg and syncs sidebar
  m.on('click', () => {
    highlightSegment(routeKey, stopIdx);
    syncSidebarSelection(stopIdx, stopIdx < itineraries[routeKey].segments.length ? stopIdx : -1);
  });

  return m;
}

// ─────────────────────────────────────────────────────────────
// BUILD ROUTE (placeholder → OSRM async replacement)
// ─────────────────────────────────────────────────────────────
async function buildRoute(routeKey) {
  if (built[routeKey]) return;
  built[routeKey] = true;

  const itin  = itineraries[routeKey];
  const color = COLORS[routeKey];
  const stops = itin.stops;
  const group = L.layerGroup().addTo(map);

  mapGroup[routeKey] = group;
  segLines[routeKey] = [];
  stopMks[routeKey]  = [];

  // 1. Draw straight-line placeholders for every leg immediately
  for (let i = 0; i < stops.length - 1; i++) {
    const from = stops[i], to = stops[i + 1];
    const pl = L.polyline(
      [[from.lat, from.lng], [to.lat, to.lng]],
      { color, weight: 3, opacity: 0.45, dashArray: '8 6' }
    );
    attachSegTooltip(pl, routeKey, i);
    pl.on('click', () => {
      highlightSegment(routeKey, i);
      syncSidebarSelection(i, i);
    });
    group.addLayer(pl);
    segLines[routeKey].push(pl);
  }

  // 2. Add numbered stop markers
  stops.forEach((stop, i) => {
    const m = makeStopMarker(stop, color, routeKey, i);
    group.addLayer(m);
    stopMks[routeKey].push(m);
  });

  // 3. Fire OSRM fetches in background — replace placeholders as results arrive
  const total = stops.length - 1;
  pendingLegs = 0;
  updateLoading(total, routeKey);

  for (let i = 0; i < total; i++) {
    const from = stops[i], to = stops[i + 1];
    // Capture i in closure
    (function (segIdx, fromStop, toStop) {
      fetchOSRM(fromStop.lat, fromStop.lng, toStop.lat, toStop.lng).then(coords => {
        updateLoading(-1, routeKey);
        if (!coords) return;   // both servers failed — keep dashed placeholder

        const oldPl = segLines[routeKey][segIdx];

        // Build real-road polyline
        const pl = L.polyline(coords, { color, weight: 4, opacity: 0.88 });
        attachSegTooltip(pl, routeKey, segIdx);
        pl.on('click', () => {
          highlightSegment(routeKey, segIdx);
          syncSidebarSelection(segIdx, segIdx);
        });

        // Always update the stored reference and the group's layer set
        // (works even when the group is not currently on the map)
        group.removeLayer(oldPl);
        group.addLayer(pl);
        segLines[routeKey][segIdx] = pl;

        // Re-apply highlight if this segment is active
        if (activeSegIdx === segIdx && currentRoute === routeKey) {
          applyHighlight(routeKey, segIdx);
        }
      });
    }(i, from, to));
  }
}

function attachSegTooltip(pl, routeKey, segIdx) {
  const itin = itineraries[routeKey];
  const seg  = itin.segments[segIdx];
  const from = itin.stops[segIdx].name;
  const to   = itin.stops[segIdx + 1].name;
  pl.bindTooltip(
    `<b>${from} → ${to}</b><br>${seg.miles} mi · ${seg.time}<br><span style="color:#94a3b8">${seg.road}</span>`,
    { sticky: true, className: 'dark-tip' }
  );
}

// ─────────────────────────────────────────────────────────────
// HIGHLIGHT
// ─────────────────────────────────────────────────────────────
function applyHighlight(routeKey, segIdx) {
  const lines = segLines[routeKey];
  if (!lines) return;
  lines.forEach((pl, i) => {
    if (i === segIdx) {
      pl.setStyle({ weight: 6, opacity: 1 });
      pl.bringToFront();
    } else {
      pl.setStyle({ weight: 3, opacity: DIM });
    }
  });
}

function resetHighlight(routeKey) {
  const lines = segLines[routeKey];
  if (!lines) return;
  lines.forEach(pl => pl.setStyle({ weight: 4, opacity: 0.88 }));
}

function highlightSegment(routeKey, segIdx) {
  if (activeSegIdx === segIdx && currentRoute === routeKey) {
    // Second click → reset to full-route view
    activeSegIdx = -1;
    resetHighlight(routeKey);
    fitRoute(routeKey);
    return;
  }
  activeSegIdx = segIdx;
  applyHighlight(routeKey, segIdx);

  // Fit map to this leg's two endpoints
  const stops = itineraries[routeKey].stops;
  const from  = stops[segIdx];
  const to    = stops[Math.min(segIdx + 1, stops.length - 1)];
  const bounds = L.latLngBounds([[from.lat, from.lng], [to.lat, to.lng]]);
  map.fitBounds(bounds, { padding: [70, 70], maxZoom: 10 });
}

// ─────────────────────────────────────────────────────────────
// SIDEBAR SYNC
// ─────────────────────────────────────────────────────────────
function syncSidebarSelection(stopIdx, segIdx) {
  document.querySelectorAll('.stop-card').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.seg-card').forEach(el => el.classList.remove('seg-active'));

  const stopEl = document.querySelector(`.stop-card[data-stop="${stopIdx}"]`);
  if (stopEl) { stopEl.classList.add('selected'); stopEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  const segEl = document.querySelector(`.seg-card[data-seg="${segIdx}"]`);
  if (segEl) segEl.classList.add('seg-active');
}

// ─────────────────────────────────────────────────────────────
// FIT WHOLE ROUTE
// ─────────────────────────────────────────────────────────────
function fitRoute(routeKey) {
  const stops  = itineraries[routeKey].stops;
  const bounds = L.latLngBounds(stops.map(s => [s.lat, s.lng]));
  map.fitBounds(bounds, { padding: [50, 50] });
}

// ─────────────────────────────────────────────────────────────
// SIDEBAR RENDER
// ─────────────────────────────────────────────────────────────
function renderSidebar(routeKey) {
  const itin  = itineraries[routeKey];
  const color = COLORS[routeKey];
  const c     = itin.costs;

  let html = `
    <div class="itin-header">
      <div class="itin-title" style="color:${color}">${itin.name}</div>
      <div class="itin-sub">${itin.subtitle}</div>
      <div class="itin-badges">
        <span class="badge">&#128197; ${itin.duration}</span>
        <span class="badge">&#128662; Camper Van</span>
        <span class="badge">&#128205; ${itin.stops.length} stops</span>
        <span class="badge">&#128739; ${itin.totalMiles} miles</span>
      </div>
    </div>

    <div class="cost-block">
      <h3>Estimated Budget &mdash; 4 People</h3>
      <div class="cost-grid">
        <div class="cost-item"><div class="cost-label">&#128662; Van Rental</div><div class="cost-value" style="color:${color}">${c.vanRental}</div></div>
        <div class="cost-item"><div class="cost-label">&#9981; Gas</div><div class="cost-value" style="color:${color}">${c.gas}</div></div>
        <div class="cost-item"><div class="cost-label">&#127828; Food</div><div class="cost-value" style="color:${color}">${c.food}</div></div>
        <div class="cost-item"><div class="cost-label">&#9978; Camping</div><div class="cost-value" style="color:${color}">${c.camping}</div></div>
        <div class="cost-item"><div class="cost-label">&#127966; Parks Pass</div><div class="cost-value" style="color:${color}">${c.parks}</div></div>
        <div class="cost-item"><div class="cost-label">&#127917; Misc / Activities</div><div class="cost-value" style="color:${color}">${c.misc}</div></div>
        <div class="cost-item cost-total">
          <div class="cost-label">&#128176; Total</div>
          <div class="cost-value">${c.total} <span style="font-size:0.72rem;font-weight:500;color:#93c5fd">(${c.perPerson} / person)</span></div>
        </div>
      </div>
      <div class="cost-note">&#8505; ${c.note}. Gas ~$0.18/mi. Food ~$120/day for 4. Camping ~$15/night avg (free BLM + paid sites; one site for the van). America the Beautiful Pass ($80) covers all 4 passengers. Van ~$150/day.</div>
    </div>

    <div class="section-heading">Itinerary &amp; Driving Legs</div>
    <div class="stops-list">
  `;

  itin.stops.forEach((stop, i) => {
    const seg = itin.segments[i];
    // Stop card — clicking focuses the outgoing leg (stop i → stop i+1)
    html += `
      <div class="stop-card" data-stop="${i}" onclick="onStopClick('${routeKey}', ${i})">
        <div class="stop-header">
          <div class="stop-num" style="background:${color}25;color:${color}">${stop.num}</div>
          <div class="stop-info">

          </div>
        </div>

          ${stop.desc}
          <div class="stop-highlights">
            ${stop.highlights.map(h => `<span class="hl-tag">&#9733; ${h}</span>`).join('')}
          </div>
        </div>
      </div>
    `;
    // Segment card — clicking focuses that specific leg
    if (seg) {
      html += `
        <div class="seg-card" data-seg="${i}" style="border-left-color:${color}60"
             onclick="onSegClick('${routeKey}', ${i})">
          <span class="seg-arrow" style="color:${color}90">&#8595;</span>
          <div class="seg-info">
            <div class="seg-road">${seg.road}</div>
            <div class="seg-notes">${seg.notes}</div>
          </div>
          <div class="seg-dist" style="color:${color}">${seg.miles} mi<br><span style="color:#475569;font-weight:400">${seg.time}</span></div>
        </div>
      `;
    }
  });

  html += `</div>`;
  document.getElementById('sidebar').innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// CLICK HANDLERS (called from HTML)
// ─────────────────────────────────────────────────────────────
function onStopClick(routeKey, stopIdx) {
  // Focus the outgoing leg from this stop; if last stop, zoom to it
  const maxSeg = itineraries[routeKey].segments.length - 1;
  const segIdx = Math.min(stopIdx, maxSeg);
  highlightSegment(routeKey, segIdx);
  syncSidebarSelection(stopIdx, segIdx);
}

function onSegClick(routeKey, segIdx) {
  highlightSegment(routeKey, segIdx);
  // scroll stop card into view for the origin of this leg
  syncSidebarSelection(segIdx, segIdx);
}

// ─────────────────────────────────────────────────────────────
// ROUTE SELECTION (tab switch)
// ─────────────────────────────────────────────────────────────
async function selectRoute(routeKey) {
  currentRoute = routeKey;
  activeSegIdx = -1;
  pendingLegs  = 0;
  loadingBar.classList.remove('visible');

  // Update tabs
  document.querySelectorAll('.route-tab').forEach(tab => {
    tab.className = 'route-tab';
    if (tab.getAttribute('onclick') === `selectRoute('${routeKey}')`) {
      tab.className = `route-tab active-${routeKey}`;
    }
  });

  // Hide all other routes
  Object.entries(mapGroup).forEach(([k, grp]) => {
    if (k !== routeKey && map.hasLayer(grp)) map.removeLayer(grp);
  });

  // Render sidebar immediately (doesn't depend on map layers)
  renderSidebar(routeKey);

  // Show / build this route
  if (!built[routeKey]) {
    await buildRoute(routeKey);   // draws placeholders synchronously, fires OSRM in bg
  } else {
    // Re-attach group if it was removed
    if (!map.hasLayer(mapGroup[routeKey])) mapGroup[routeKey].addTo(map);
    resetHighlight(routeKey);
  }

  fitRoute(routeKey);
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
selectRoute('A');
</script>
